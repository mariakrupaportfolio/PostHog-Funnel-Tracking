<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fjord Data Summit</title>
  <script src="tracking.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 80px auto; padding: 0 16px; }
    .register { font-size: 24px; padding: 16px 48px; cursor: pointer; }
  </style>
</head>
<body>
  <p><small>Fictional event, built as a tracking demo.</small></p>
  <h1>Fjord Data Summit 2027</h1>
  <p>Copenhagen · 14–15 April 2027</p>
  <p>Two days of talks on analytics, experimentation and AI.</p>

  <button class="register" id="register">Register</button>

  <script>
    // EVENT 1 — the page opened.
    // UTM properties tell us WHERE the visitor came from. Test it by opening
    // index.html?utm_source=linkedin — PostHog will show utm_source: "linkedin".
    track('event_page_viewed', {
      utm_source: getFromUrl('utm_source'),
      utm_campaign: getFromUrl('utm_campaign')
    });

    // EVENT 2 — they pressed Register. Then we move them to the ticket page.
    document.getElementById('register').addEventListener('click', function () {
      track('register_clicked');
      window.location.href = 'tickets.html';
    });
  </script>
</body>
</html>
