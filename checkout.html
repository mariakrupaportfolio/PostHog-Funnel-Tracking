<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · Fjord Data Summit</title>
  <script src="tracking.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 80px auto; padding: 0 16px; }
    button { font-size: 18px; padding: 12px 32px; cursor: pointer; }
    #done { display: none; }
  </style>
  <!-- PostHog -->

</head>
<body>
  <div id="checkout">
    <h1>Checkout</h1>
    <p>Ticket: <strong id="ticket-name"></strong></p>
    <p>Total: <strong id="price"></strong> DKK</p>
    <p><small>Fake checkout: no payment is taken.</small></p>
    <button id="pay">Pay now</button>
  </div>

  <div id="done">
    <h1>You're registered!</h1>
    <p>Order <strong id="order"></strong></p>
  </div>

  <script>
    // Read which ticket was chosen on the previous page (from the URL).
    var ticket = getFromUrl('ticket');
    var prices = { standard: 1200, vip: 3500 };
    var price = prices[ticket];

    document.getElementById('ticket-name').textContent = ticket;
    document.getElementById('price').textContent = price;

    // EVENT 4 — they reached checkout. Comparing this with EVENT 5
    // shows how many people get to checkout but never pay.
    track('checkout_started', {
      ticket_type: ticket,
      price_dkk: price
    });

    // EVENT 5 — the conversion. order_id makes each purchase unique,
    // so duplicates can be spotted and removed later.
    document.getElementById('pay').addEventListener('click', function () {
      var orderId = 'FDS-' + Date.now();
      track('purchase_completed', {
        ticket_type: ticket,
        price_dkk: price,
        order_id: orderId
      });
      document.getElementById('order').textContent = orderId;
      document.getElementById('checkout').style.display = 'none';
      document.getElementById('done').style.display = 'block';
    });
  </script>
</body>
</html>
