<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickets · Fjord Data Summit</title>
  <script src="tracking.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 80px auto; padding: 0 16px; }
    .ticket { border: 1px solid #ccc; padding: 16px; margin: 16px 0; }
    button { padding: 10px 24px; cursor: pointer; }
  </style>
  <!-- PostHog -->

</head>
<body>
  <h1>Choose your ticket</h1>
  <p>Venue: Fictional Hall, Copenhagen. Doors open 8:30.</p>

  <div class="ticket">
    <h2>Standard — 1,200 DKK</h2>
    <p>Both days, all talks.</p>
    <!-- data-ticket and data-price are labels the script reads on click -->
    <button data-ticket="standard" data-price="1200">Choose Standard</button>
  </div>

  <div class="ticket">
    <h2>VIP — 3,500 DKK</h2>
    <p>Everything, plus the speaker dinner.</p>
    <button data-ticket="vip" data-price="3500">Choose VIP</button>
  </div>

  <script>
    // EVENT 3 — ONE event for BOTH buttons. The difference is a PROPERTY.
    // In PostHog you then "break down ticket_selected by ticket_type"
    // instead of comparing two separate events.
    document.querySelectorAll('[data-ticket]').forEach(function (button) {
      button.addEventListener('click', function () {
        track('ticket_selected', {
          ticket_type: button.dataset.ticket,          // 'standard' or 'vip'
          price_dkk: Number(button.dataset.price)      // 1200 or 3500, as a number
        });
        // Pass the choice to the next page through the URL.
        window.location.href = 'checkout.html?ticket=' + button.dataset.ticket;
      });
    });
  </script>
</body>
</html>
